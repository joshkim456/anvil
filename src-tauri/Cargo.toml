[package]
name = "anvil"
version = "0.1.0"
description = "AI Minecraft modpack curator + launcher"
authors = ["Joshua Kim"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77"

# Tauri 2 desktop library + binary split.
[lib]
name = "anvil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "time"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
