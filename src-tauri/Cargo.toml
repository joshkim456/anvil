[package]
name = "anvil"
version = "0.1.0"
description = "AI Minecraft modpack curator + launcher"
authors = ["Joshua Kim"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.77"

# Tauri 2 desktop library + binary split.
[lib]
name = "anvil_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
# Legacy login.live.com Minecraft auth (Modrinth/Theseus scheme): P-256 device
# key + per-request ECDSA signing, PKCE, device id.
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "time"] }
# Decode mod item textures + encode rendered 3D-model icons. Already in the
# build closure transitively (tauri muda/tray-icon/ico), so no extra cost.
png = "0.18"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
